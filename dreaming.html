<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreaming</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      gap: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255,255,255,.35);
    }

    .collage {
      width: min(1100px, 96vw);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, minmax(180px, 32vw));
      gap: 6px;
      padding: 6px;
      background: #111;
      border: 1px solid #222;
      box-shadow: 0 20px 60px rgba(0,0,0,.65);
    }

    .gif {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #080808;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #555;
      background: rgba(255,255,255,.08);
      color: white;
      padding: 12px 20px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      transition: .2s ease;
      backdrop-filter: blur(8px);
    }

    button:hover {
      background: rgba(255,255,255,.18);
      transform: translateY(-1px);
    }

    .status {
      opacity: .6;
      font-size: 13px;
      text-align: center;
      max-width: 600px;
    }

    @media (max-width: 700px) {
      .collage {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(3, minmax(150px, 45vw));
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1>Dreaming</h1>

    <section class="collage" aria-label="Collage de GIFs">
      <img class="gif" src="1.gif" alt="Dreaming GIF 1">
      <img class="gif" src="2.gif" alt="Dreaming GIF 2">
      <img class="gif" src="3.gif" alt="Dreaming GIF 3">
      <img class="gif" src="4.gif" alt="Dreaming GIF 4">
      <img class="gif" src="5.gif" alt="Dreaming GIF 5">
      <img class="gif" src="6.gif" alt="Dreaming GIF 6">
    </section>

    <div class="controls">
      <button id="wavButton" type="button">▶ Reproducir audio</button>
    </div>

    <div class="status" id="status">
      La música de fondo se reproduce en bucle cuando el navegador lo permite.
    </div>
  </main>

  <!-- Canción de fondo -->
  <audio id="backgroundMusic" src="song.mp3" loop autoplay></audio>

  <!-- Audio del botón -->
  <audio id="wavAudio" src="audio.wav"></audio>

  <script>
    const backgroundMusic = document.getElementById("backgroundMusic");
    const wavAudio = document.getElementById("wavAudio");
    const wavButton = document.getElementById("wavButton");
    const status = document.getElementById("status");

    // Volumen suave para la canción de fondo.
    backgroundMusic.volume = 0.35;

    // Los navegadores suelen bloquear el autoplay con sonido.
    // En la primera interacción del usuario intentamos iniciar la música.
    function startBackgroundMusic() {
      backgroundMusic.play().catch(() => {});
    }

    document.addEventListener("click", startBackgroundMusic, { once: true });
    document.addEventListener("keydown", startBackgroundMusic, { once: true });

    wavButton.addEventListener("click", async () => {
      startBackgroundMusic();

      try {
        wavAudio.currentTime = 0;
        await wavAudio.play();
        wavButton.textContent = "❚❚ Pausar audio";
        status.textContent = "Reproduciendo audio.wav";
      } catch (error) {
        status.textContent = "No se pudo reproducir audio.wav.";
      }
    });

    wavAudio.addEventListener("pause", () => {
      wavButton.textContent = "▶ Reproducir audio";
    });

    wavAudio.addEventListener("ended", () => {
      wavButton.textContent = "▶ Reproducir audio";
      status.textContent = "Audio terminado.";
    });
  </script>
</body>
</html>
